# Blueprint do Render: cria o Web Service (FastAPI) e o banco PostgreSQL de uma vez.
# No painel do Render: New > Blueprint > selecione o repositório do GitHub.
services:
  - type: web
    name: performanceai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DATABASE_URL
        fromDatabase:
          name: performanceai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # o Render gera um segredo aleatório
      - key: OPENAI_API_KEY
        sync: false                  # preencher manualmente no painel (nunca no código)
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: JWT_EXPIRE_HOURS
        value: "72"
      - key: FREE_MONTHLY_LIMIT
        value: "20"

databases:
  - name: performanceai-db
    plan: free
    databaseName: performanceai
    user: performanceai
